<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saia — Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/images/saia-tab.png" />
</head>
<body class="archive-bg">
  <nav class="archive-navbar">
    <a href="/"><img src="/images/saia-logo.png" alt="Saia logo"></a>
    <div class="navbar-actions">
      <button class="btn" id="saveOrderBtn" style="margin-right:12px;">Save Order</button>
      <button class="btn btn-edit" style="margin-right:-20px;" id="editBtn">Add</button>
    </div>
  </nav>
  <main class="archive-container">
    <div id="editModal">
      <div class="modal-bg">
        <div class="modal">
          <button class="close-btn" id="closeModalBtn">&times;</button>
          <form class="add-garment-form" id="addGarmentForm">
            <div>
              <div class="img-drop-zone" id="imgDropZone1">
                Drag & drop a cover image here or click to select
                <input type="file" id="imgInput1" accept="image/*" style="display:none;" />
                <img id="imgPreview1" class="img-preview" style="display:none;" />
              </div>
              <div class="img-drop-zone" id="imgDropZone2">
                Drag & drop a 2nd image here or click to select
                <input type="file" id="imgInput2" accept="image/*" style="display:none;" />
                <img id="imgPreview2" class="img-preview" style="display:none;" />
              </div>
            </div>
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />
            <label for="size">Size</label>
            <input id="size" name="size" type="text" required />
            <label for="condition">Condition</label>
            <select id="condition" name="condition" required>
              <option value="">Select condition</option>
              <option value="New">New</option>
              <option value="Excellent">Excellent</option>
              <option value="Very good">Very good</option>
              <option value="Good">Good</option>
            </select>
            <label for="description">Description</label>
            <input id="description" name="description" type="text" required />
            <button class="btn" type="submit">Add Garment</button>
          </form>
        </div>
      </div>
    </div>
    <section id="list" class="grid"></section>
  </main>
  <script>
    // Modal logic
    const editBtn = document.getElementById('editBtn');
    const editModal = document.getElementById('editModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    editBtn.addEventListener('click', () => {
      editModal.classList.add('active');
    });
    closeModalBtn.addEventListener('click', () => {
      editModal.classList.remove('active');
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') editModal.classList.remove('active');
    });

    // Drag & drop image logic for two images
    let uploadedImageDataUrl1 = '';
    let uploadedImageDataUrl2 = '';

    function setupDropZone(dropZoneId, inputId, previewId, setImageCallback) {
      const dropZone = document.getElementById(dropZoneId);
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);

      dropZone.addEventListener('click', () => input.click());
      dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.style.background = '#eaeaea';
      });
      dropZone.addEventListener('dragleave', e => {
        e.preventDefault();
        dropZone.style.background = '#fafafa';
      });
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.style.background = '#fafafa';
        const file = e.dataTransfer.files[0];
        handleImageFile(file, preview, setImageCallback);
      });
      input.addEventListener('change', e => {
        const file = e.target.files[0];
        handleImageFile(file, preview, setImageCallback);
      });
    }

    function handleImageFile(file, preview, setImageCallback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        setImageCallback(e.target.result);
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    setupDropZone('imgDropZone1', 'imgInput1', 'imgPreview1', (dataUrl) => uploadedImageDataUrl1 = dataUrl);
    setupDropZone('imgDropZone2', 'imgInput2', 'imgPreview2', (dataUrl) => uploadedImageDataUrl2 = dataUrl);

    // Add garment form logic
    document.getElementById('addGarmentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const size = document.getElementById('size').value;
      const condition = document.getElementById('condition').value;
      const description = document.getElementById('description').value;
      if (!uploadedImageDataUrl1 || !uploadedImageDataUrl2) {
        alert('Please upload both images.');
        return;
      }
      // Send to server (you need to implement /api/garments POST in server.js)
      const res = await fetch('/api/garments', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          title, size, condition, description,
          imageData1: uploadedImageDataUrl1,
          imageData2: uploadedImageDataUrl2
        })
      });
      const result = await res.json();
      if (res.ok && result.success) {
        alert('Garment added!');
        location.reload();
      } else {
        alert('Failed to add garment: ' + (result.error || 'Unknown error'));
      }
    });

    // Existing grid logic (unchanged)
    function getAltImage(g) {
      return g.image2 || g.image1;
    }

    let currentGarments = [];

    async function load() {
      try {
        const res = await fetch('/api/garments');
        if (!res.ok) throw new Error('failed');
        const data = await res.json();
        currentGarments = data.slice(); // Copy for local order tracking
        renderGrid();
      } catch (e) {
        document.getElementById('list').innerHTML = '<p>Unable to load garments.</p>';
      }
    }
    load();

    function attachCardListeners() {
      // Hover logic for alternate image
      currentGarments.forEach((g, idx) => {
        const carouselId = `carousel-${idx}`;
        const el = document.getElementById(carouselId);
        const altImage = getAltImage(g);
        if (el && altImage && altImage !== g.image1) {
          el.onmouseenter = () => { el.src = altImage; };
          el.onmouseleave = () => { el.src = g.image1; };
        }
      });

      // Drag-and-drop logic
      let dragSrcIdx = null;
      document.querySelectorAll('.card').forEach((card, idx) => {
        card.addEventListener('dragstart', function(e) {
          dragSrcIdx = idx;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', ''); // Required for Firefox
          this.classList.add('dragElem');
        });
        card.addEventListener('dragover', function(e) {
          e.preventDefault();
          this.classList.add('over');
        });
        card.addEventListener('dragleave', function(e) {
          this.classList.remove('over');
        });
        card.addEventListener('drop', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const dropIdx = Array.from(document.querySelectorAll('.card')).indexOf(this);
          if (dragSrcIdx !== null && dragSrcIdx !== dropIdx) {
            // Move the item in the array
            const moved = currentGarments.splice(dragSrcIdx, 1)[0];
            currentGarments.splice(dropIdx, 0, moved);
            renderGrid(); // Re-render grid and re-attach listeners
          }
          return false;
        });
        card.addEventListener('dragend', function(e) {
          document.querySelectorAll('.card').forEach(c => c.classList.remove('over', 'dragElem'));
        });
      });
    }

    document.addEventListener('click', async function(e) {
      if (e.target.classList.contains('btn-delete')) {
        const id = e.target.getAttribute('data-id');
        if (confirm('Are you sure you want to delete this garment?')) {
          const res = await fetch('/api/garments', {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id })
          });
          const result = await res.json();
          if (res.ok && result.success) {
            alert('Garment deleted!');
            load();
          } else {
            alert('Failed to delete garment: ' + (result.error || 'Unknown error'));
          }
        }
      }
    });

    document.getElementById('saveOrderBtn').addEventListener('click', async function() {
      const ids = currentGarments.map(g => g.id);
      const res = await fetch('/api/garments/order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ order: ids })
      });
      const result = await res.json();
      if (res.ok && result.success) {
        alert('Order saved!');
        load();
      } else {
        alert('Failed to save order: ' + (result.error || 'Unknown error'));
      }
    });

    function renderGrid() {
      const container = document.getElementById('list');
      if (!currentGarments.length) {
        container.innerHTML = '<p>No garments available.</p>';
        return;
      }
      container.innerHTML = currentGarments.map((g, idx) => {
        const altImage = getAltImage(g);
        const carouselId = `carousel-${idx}`;
        return `
          <article class="card" data-id="${g.id}" draggable="true">
            <img src="${g.image1}" alt="${g.title}" class="carousel-img" id="${carouselId}" />
            <h3>${g.title}</h3>
            <div class="meta">${
              g.size ? `Size: ${g.size}` : ''
            }${g.size && g.condition ? ' • ' : ''}${g.condition ? `Condition: ${g.condition}` : ''}</div>
            <div class="desc">${g.description || ''}</div>
            <button class="btn btn-delete" data-id="${g.id}" style="margin-top:8px;background:#c00;">Delete</button>
          </article>
        `;
      }).join('');
      attachCardListeners();
    }
  </script>
</body>
</html>
