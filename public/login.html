<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saia — Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/images/saia-tab.png" />
</head>
<body class="login-bg">
  <main>
    <form method="post" action="/login" class="login-box">
      <h2>Welcome</h2>
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autofocus />
      <button class="btn" type="submit">Continue</button>
      <div class="back-link"><a href="/">Back</a></div>
    </form>
  </main>
</body>
</html>
