<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saia — Archive</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/images/saia-tab.png" />
</head>
<body class="archive-bg">
  <nav class="archive-navbar">
    <a href="/"><img src="/images/diamond-logo.png" alt="Saia logo"></a>
  </nav>
  <main class="archive-container">
    <section id="list" class="grid"></section>
  </main>
  <script>
  function getAltImage(g) {
    return g.image2 || g.image1;
  }

  async function load() {
    try {
      const res = await fetch('/api/garments');
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      const container = document.getElementById('list');
      if (!data.length) {
        container.innerHTML = '<p>No garments available.</p>';
        return;
      }
      container.innerHTML = data.map((g, idx) => {
        const altImage = getAltImage(g);
        const carouselId = `carousel-${idx}`;
        const hasMultipleImages = altImage && altImage !== g.image1;
        return `
          <article class="card">
            <div class="image-container">
              <img src="${g.image1}" alt="${g.title}" class="carousel-img" id="${carouselId}" />
              ${hasMultipleImages ? `
                <button class="carousel-arrow carousel-arrow-left" data-index="${idx}" data-direction="prev">‹</button>
                <button class="carousel-arrow carousel-arrow-right" data-index="${idx}" data-direction="next">›</button>
              ` : ''}
            </div>
            <div class="brand">${g.brand || ''}</div>
            <h3>${g.title}</h3>
            <div class="size">${g.size ? `Size: ${g.size}` : ''}</div>
          </article>
        `;
      }).join('');

      // Click arrow logic
      let currentImageIndex = data.map(() => 0);

      document.querySelectorAll('.carousel-arrow').forEach(arrow => {
        arrow.addEventListener('click', function(e) {
          e.preventDefault();
          const index = parseInt(this.getAttribute('data-index'));
          const img = document.getElementById(`carousel-${index}`);
          const images = [data[index].image1, getAltImage(data[index])];
          currentImageIndex[index] = 1 - currentImageIndex[index];
          img.src = images[currentImageIndex[index]];
        });
      });
    } catch (e) {
      document.getElementById('list').innerHTML = '<p>Unable to load garments.</p>';
    }
  }
  load();
  </script>
</body>
</html>
