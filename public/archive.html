<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saia — Archive</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/images/saia-tab.png" />
</head>
<body class="archive-bg">
  <nav class="archive-navbar">
    <img src="/images/saia-logo.png" alt="Saia logo" style="height:140px; width:auto; margin-left:-40px;">
    <span class="navbar-title" style="font-size:2.2rem;font-weight:700;letter-spacing:0.12em;margin-left:32px;">ARCHIVE</span>
    <div class="navbar-actions">
      <form action="/logout" method="get">
        <button type="submit" class="btn btn-logout">Log out</button>
      </form>
    </div>
  </nav>
  <main class="archive-container">
    <section id="list" class="grid"></section>
  </main>
  <script>
    function getAltImage(g) {
      const altMap = {
        "/images/sample-jacket.jpg": "/images/trenchcoat-sample.jpg",
        "/images/experimental-coat.png": "/images/sample-woolsweater.jpg",
        "/images/trenchcoat-sample.jpg": "/images/denimshirt-sample.jpg",
        "/images/denimshirt-sample.jpg": "/images/sample-corduroypants.jpg",
        "/images/sample-woolsweater.jpg": "/images/sample-silkblouse.jpg",
        "/images/sample-corduroypants.jpg": "/images/sample-puffervest.jpg",
        "/images/sample-silkblouse.jpg": "/images/sample-jacket.jpg",
        "/images/sample-puffervest.jpg": "/images/experimental-coat.png"
      };
      return altMap[g.image] || g.image;
    }

    async function load() {
      try {
        const res = await fetch('/api/garments');
        if (!res.ok) throw new Error('failed');
        const data = await res.json();
        const container = document.getElementById('list');
        if (!data.length) {
          container.innerHTML = '<p>No garments available.</p>';
          return;
        }
        container.innerHTML = data.map((g, idx) => {
          const altImage = getAltImage(g);
          const carouselId = `carousel-${idx}`;
          return `
            <article class="card">
              <img src="${g.image}" alt="${g.title}" class="carousel-img" id="${carouselId}" />
              <h3>${g.title}</h3>
              <div class="meta">${
                g.size ? `Size: ${g.size}` : ''
              }${g.size && g.condition ? ' • ' : ''}${g.condition ? `Condition: ${g.condition}` : ''}</div>
              <div class="desc">${g.description || ''}</div>
            </article>
          `;
        }).join('');

        // Hover logic for each card
        data.forEach((g, idx) => {
          const carouselId = `carousel-${idx}`;
          const el = document.getElementById(carouselId);
          const altImage = getAltImage(g);
          if (el) {
            el.addEventListener('mouseenter', () => {
              el.src = altImage;
            });
            el.addEventListener('mouseleave', () => {
              el.src = g.image;
            });
          }
        });
      } catch (e) {
        document.getElementById('list').innerHTML = '<p>Unable to load garments.</p>';
      }
    }
    load();
  </script>
</body>
</html>
